<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK Sinh Vien</title>
    <!-- Styles -->
    <link rel="stylesheet" href="../style/styles_dk.css" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <!-- Toggle Button -->
    <button id="toggle-button" class="toggle-button">☰</button>

    <!-- Dashboard Sidebar -->
    <div class="dashboard" id="dashboard">
      <!-- Dashboard Header -->
      <div class="dashboard-header">
        <h2>DK Sinh Vien</h2>
      </div>
      <!-- Navigation Menu -->
      <ul class="dashboard-menu">
        <li><a href="./home.html" title="Home"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="./account_sv.html" title="Account sinh viên"><i class="fas fa-user-graduate"></i><span>Account sinh viên</span></a></li>
        <li><a href="./account_gv.html" title="Account giảng viên"><i class="fas fa-chalkboard-teacher"></i><span>Account giảng viên</span></a></li>
        <li><a href="./quanly_kv.html" title="Quản lý khoa viên"><i class="fas fa-school"></i><span>Quản lý khoa viên</span></a></li>
        <li><a href="./quanly_tkb.html" title="Quản lý thời khóa biểu"><i class="fas fa-calendar-day"></i><span>Quản lý thời khóa biểu</span></a></li>
        <li><a href="./quanly_dd.html" title="Quản lý điểm danh"><i class="fas fa-check-circle"></i><span>Quản lý điểm danh</span></a></li>
        <li><a href="./settings.html" title="Settings"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li><a href="./dangnhap.html" title="Logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="register-container">
        <h1>Thông tin người dùng</h1>
        <h2><i class="fas fa-user-graduate"></i> Đăng ký sinh viên</h2>
        <form action="#" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label for="mssv"><i class="fas fa-id-card"></i> Mã số sinh viên</label>
            <input type="text" id="mssv" name="mssv" required>
          </div>
  
          <div class="form-group">
            <label for="malop"><i class="fas fa-users"></i> Mã lớp</label>
            <input type="text" id="malop" name="malop" required>
          </div>
  
          <div class="form-group">
            <label for="holot"><i class="fas fa-user"></i> Họ lót</label>
            <input type="text" id="holot" name="holot" required>
          </div>
  
          <div class="form-group">
            <label for="ten"><i class="fas fa-user"></i> Tên</label>
            <input type="text" id="ten" name="ten" required>
          </div>
  
          <div class="form-group">
            <label for="ntns"><i class="fas fa-calendar-alt"></i> Ngày sinh</label>
            <input type="date" id="ntns" name="ntns" required>
          </div>
  
          <div class="form-group">
            <label for="phai"><i class="fas fa-venus-mars"></i> Giới tính</label>
            <select id="phai" name="phai" required>
              <option value="" disabled selected>Chọn giới tính</option>
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
  
          <div class="form-group">
            <label for="dt_sv"><i class="fas fa-phone"></i> Số điện thoại</label>
            <input type="tel" id="dt_sv" name="dt_sv" required>
          </div>
  
          <div class="form-group">
            <label for="emailSV"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="emailSV" name="emailSV" required>
          </div>
  
          <div class="form-group">
            <label for="faceID"><i class="fas fa-camera"></i> Ảnh FaceID</label>
            <input type="file" id="faceID" name="faceID" accept="image/*" required>
          </div>

          <div class="form-group">
            <label for="thoigian"><i class="fas fa-clock"></i> Thời gian học</label>
            <input type="datetime-local" id="thoigian" name="thoigian" required />
          </div>

          <div class="form-group">
            <label for="sophong"><i class="fas fa-door-closed"></i> Số phòng</label>
            <input type="text" id="sophong" name="sophong" required />
          </div>
  
          <button type="submit" class="submit-button"><i class="fas fa-save"></i> Lưu thông tin</button>
        </form>
    </div>

    <!-- JavaScript -->
    <script>
      // Get DOM elements
      const toggleButton = document.getElementById('toggle-button');
      const dashboard = document.getElementById('dashboard');

      // Toggle dashboard collapse
      toggleButton.addEventListener('click', () => {
        dashboard.classList.toggle('collapsed');
      });
      // Add Account Button Click Event
      const addAccountButton = document.getElementById('add-account-button');
      addAccountButton.addEventListener('click', () => {
        alert('Chức năng thêm tài khoản!');
      });
    </script>
  </body>
</html>
