<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký thời khóa biểu</title>
    <!-- Styles -->
    <link rel="stylesheet" href="../style/styles_dk.css" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <!-- Toggle Button -->
    <button id="toggle-button" class="toggle-button">☰</button>

    <!-- Dashboard Sidebar -->
    <div class="dashboard" id="dashboard">
      <!-- Dashboard Header -->
      <div class="dashboard-header">
        <h2>DK TKB</h2>
      </div>
      <!-- Navigation Menu -->
      <ul class="dashboard-menu">
        <li><a href="./home.html" title="Home"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="./account_sv.html" title="Account sinh viên"><i class="fas fa-user-graduate"></i><span>Account sinh viên</span></a></li>
        <li><a href="./account_gv.html" title="Account giảng viên"><i class="fas fa-chalkboard-teacher"></i><span>Account giảng viên</span></a></li>
        <li><a href="./quanly_kv.html" title="Quản lý khoa viên"><i class="fas fa-school"></i><span>Quản lý khoa viên</span></a></li>
        <li><a href="./quanly_tkb.html" title="Quản lý thời khóa biểu"><i class="fas fa-calendar-day"></i><span>Quản lý thời khóa biểu</span></a></li>
        <li><a href="./quanly_dd.html" title="Quản lý điểm danh"><i class="fas fa-check-circle"></i><span>Quản lý điểm danh</span></a></li>
        <li><a href="./settings.html" title="Settings"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li><a href="./dangnhap.html" title="Logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="register-container">
      <h1>Quản lý thời khóa biểu</h1>
      <h2><i class="fas fa-calendar-alt"></i> Nhập thời khóa biểu</h2>
      <form id="schedule-form">
        <div class="form-group">
          <label for="malop"><i class="fas fa-users"></i> Mã lớp</label>
          <input type="text" id="malop" name="malop" required />
        </div>

        <div class="form-group">
          <label for="tenmon"><i class="fas fa-book"></i> Tên môn học</label>
          <input type="text" id="tenmon" name="tenmon" required />
        </div>

        <div class="form-group">
          <label for="thoigian"><i class="fas fa-calendar-alt"></i> Thời gian học</label>
          <input type="date" id="thoigian" name="thoigian" required />
          <p id="thu-hienthi" style="margin-top: 5px; font-weight: bold; color: #2c3e50;"></p>
        </div>

        <div class="form-group">
          <label for="giangvien"><i class="fas fa-chalkboard-teacher"></i> Giảng viên</label>
          <input type="text" id="giangvien" name="giangvien" required />
        </div>

        <div class="form-group">
          <label for="sophong"><i class="fas fa-door-closed"></i> Số phòng</label>
          <input type="text" id="sophong" name="sophong" required />
        </div>

        <div class="form-group">
          <label for="tietbatdau"><i class="fas fa-hourglass-start"></i> Tiết bắt đầu</label>
          <input type="number" id="tietbatdau" name="tietbatdau" min="1" required />
        </div>

        <div class="form-group">
          <label for="tietketthuc"><i class="fas fa-hourglass-end"></i> Tiết kết thúc</label>
          <input type="number" id="tietketthuc" name="tietketthuc" min="1" required />
        </div>

        <button type="submit" class="submit-button"><i class="fas fa-save"></i> Lưu thời khóa biểu</button>
      </form>
    </div>

    <!-- JavaScript -->
    
    <script>
      // Get DOM elements
      const toggleButton = document.getElementById('toggle-button');
      const dashboard = document.getElementById('dashboard');
      const scheduleForm = document.getElementById('schedule-form');

      // Toggle dashboard collapse
      toggleButton.addEventListener('click', () => {
        dashboard.classList.toggle('collapsed');
      });

      // Handle form submission
      scheduleForm.addEventListener('submit', (event) => {
        event.preventDefault();

        // Collect form data
        const formData = {
          malop: document.getElementById('malop').value,
          tenmon: document.getElementById('tenmon').value,
          thoigian: document.getElementById('thoigian').value,
          giangvien: document.getElementById('giangvien').value,
          sophong: document.getElementById('sophong').value,
          tietbatdau: document.getElementById('tietbatdau').value,
          tietketthuc: document.getElementById('tietketthuc').value,
        };

        // Validate form data
        if (
          !formData.malop ||
          !formData.tenmon ||
          !formData.thoigian ||
          !formData.giangvien ||
          !formData.sophong ||
          !formData.tietbatdau ||
          !formData.tietketthuc
        ) {
          alert('Vui lòng điền đầy đủ thông tin!');
          return;
        }

        // Send data to the backend
        fetch('https://mybackend.loca.lt/v1/api/thoikhoabieu', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        })
          .then((response) => {
            if (response.ok) {
              alert('Thời khóa biểu đã được lưu thành công!');
              scheduleForm.reset();
            } else {
              alert('Lỗi khi lưu thời khóa biểu. Vui lòng thử lại.');
            }
          })
          .catch((error) => {
            console.error('Lỗi khi gửi dữ liệu:', error);
            alert('Lỗi kết nối đến máy chủ.');
          });
      });
    </script>
  </body>
</html>
