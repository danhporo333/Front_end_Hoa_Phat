<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK Khoa vien</title>
    <!-- Styles -->
    <link rel="stylesheet" href="../style/styles_dk.css" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <!-- Toggle Button -->
    <button id="toggle-button" class="toggle-button">☰</button>

    <!-- Dashboard Sidebar -->
    <div class="dashboard" id="dashboard">
      <!-- Dashboard Header -->
      <div class="dashboard-header">
        <h2>DK Khoa vien</h2>
      </div>
      <!-- Navigation Menu -->
      <ul class="dashboard-menu">
        <li><a href="./home.html" title="Home"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="./account_sv.html" title="Account sinh viên"><i class="fas fa-user-graduate"></i><span>Account sinh viên</span></a></li>
        <li><a href="./account_gv.html" title="Account giảng viên"><i class="fas fa-chalkboard-teacher"></i><span>Account giảng viên</span></a></li>
        <li><a href="./quanly_kv.html" title="Quản lý khoa viên"><i class="fas fa-school"></i><span>Quản lý khoa viên</span></a></li>
        <li><a href="./quanly_tkb.html" title="Quản lý thời khóa biểu"><i class="fas fa-calendar-day"></i><span>Quản lý thời khóa biểu</span></a></li>
        <li><a href="./quanly_dd.html" title="Quản lý điểm danh"><i class="fas fa-check-circle"></i><span>Quản lý điểm danh</span></a></li>
        <li><a href="./settings.html" title="Settings"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li><a href="./dangnhap.html" title="Logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="register-container">
      <h1>Quản lý khoa viện</h1>
      <h2><i class="fas fa-school"></i> Nhập thông tin khoa viện</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="makv"><i class="fas fa-id-badge"></i> Mã khoa viện</label>
          <input type="text" id="makv" name="makv" required />
        </div>

        <div class="form-group">
          <label for="tenkv"><i class="fas fa-building"></i> Tên khoa viện</label>
          <input type="text" id="tenkv" name="tenkv" required />
        </div>

        <div class="form-group">
          <label for="dtkv"><i class="fas fa-phone"></i> Điện thoại</label>
          <input type="text" id="dtkv" name="dtkv" required />
        </div>

        <div class="form-group">
          <label for="diaChi"><i class="fas fa-map-marker-alt"></i> Địa chỉ</label>
          <input type="text" id="diaChi" name="diaChi" required />
        </div>

        <div class="form-group">
          <label for="soLop"><i class="fas fa-users"></i> Số lớp</label>
          <input type="number" id="soLop" name="soLop" required />
        </div>

        <div class="form-group">
          <label for="ngaythanhlap"><i class="fas fa-calendar-alt"></i> Ngày thành lập</label>
          <input type="date" id="ngaythanhlap" name="ngaythanhlap" required />
        </div>

        <div class="form-group">
          <label for="sophong"><i class="fas fa-door-closed"></i> Số phòng</label>
          <input type="text" id="sophong" name="sophong" required />
        </div>

        <button type="submit" class="submit-button"><i class="fas fa-save"></i> Lưu khoa viện</button>
      </form>
    </div>

    <!-- JavaScript -->
    <script>
      // Get DOM elements
      const toggleButton = document.getElementById('toggle-button');
      const dashboard = document.getElementById('dashboard');

      // Toggle dashboard collapse
      toggleButton.addEventListener('click', () => {
        dashboard.classList.toggle('collapsed');
      });
    </script>
  </body>
</html>
