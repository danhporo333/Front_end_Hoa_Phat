<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QL diem danh</title>
    <!-- Styles -->
    <link rel="stylesheet" href="../style/styles_account.css" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <!-- Toggle Button -->
    <button id="toggle-button" class="toggle-button">☰</button>

    <!-- Dashboard Sidebar -->
    <div class="dashboard" id="dashboard">
      <!-- Dashboard Header -->
      <div class="dashboard-header">
        <h2>QL Điểm danh</h2>
      </div>
      <!-- Navigation Menu -->
      <ul class="dashboard-menu">
        <li><a href="./home.html" title="Home"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="./account_sv.html" title="Account sinh viên"><i class="fas fa-user-graduate"></i><span>Account sinh viên</span></a></li>
        <li><a href="./account_gv.html" title="Account giảng viên"><i class="fas fa-chalkboard-teacher"></i><span>Account giảng viên</span></a></li>
        <li><a href="./quanly_kv.html" title="Quản lý khoa viên"><i class="fas fa-school"></i><span>Quản lý khoa viên</span></a></li>
        <li><a href="./quanly_tkb.html" title="Quản lý thời khóa biểu"><i class="fas fa-calendar-day"></i><span>Quản lý thời khóa biểu</span></a></li>
        <li><a href="./quanly_dd.html" title="Quản lý điểm danh"><i class="fas fa-check-circle"></i><span>Quản lý điểm danh</span></a></li>
        <li><a href="./settings.html" title="Settings"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li><a href="./dangnhap.html" title="Logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>Quản lý điểm danh</h2>
      <table id="attendance-table" class="user-info-table">
        <thead>
          <tr>
            <th>MSSV</th>
            <th>ID</th>
            <th>Có mặt</th>
            <th>Đi trễ</th>
            <th>Lý do khác</th>
            <th>Face ID</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dữ liệu sẽ được chèn bằng JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- JavaScript -->
    <script>
      // Fetch attendance data from the API
      fetch('https://mybackend.loca.lt/v1/api/diemdanh')
        .then(response => response.json())
        .then(data => {
          if (data && data.data && data.data.diemdanh) {
            const attendanceList = data.data.diemdanh;
            const tableBody = document.querySelector('#attendance-table tbody');

            attendanceList.forEach(record => {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${record.mssv}</td>
                <td>${record.id}</td>
                <td>${record.coMat ? 'Có' : 'Không'}</td>
                <td>${record.diTre ? 'Có' : 'Không'}</td>
                <td>${record.lyDoKhac || ''}</td>
                <td>${record.faceID || ''}</td>
              `;
              tableBody.appendChild(row);
            });
          } else {
            console.error("Dữ liệu trả về không đúng định dạng.");
          }
        })
        .catch(error => {
          console.error("Lỗi khi gọi API:", error);
        });

      // Toggle dashboard collapse
      const toggleButton = document.getElementById('toggle-button');
      const dashboard = document.getElementById('dashboard');
      toggleButton.addEventListener('click', () => {
        dashboard.classList.toggle('collapsed');
      });

      // Add Attendance Button Click Event
      const addAttendanceButton = document.getElementById('add-attendance-button');
      addAttendanceButton.addEventListener('click', () => {
        alert('Chức năng thêm điểm danh!');
      });
    </script>
  </body>
</html>
