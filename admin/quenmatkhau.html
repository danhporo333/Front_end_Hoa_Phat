<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="../style/styles_login_register.css">
</head>
<body>
    <div class="register-container">
        <h2>Quên mật khẩu</h2>
        <form action="#" method="POST">
            <input type="text" name="student_id" placeholder="Mã số sinh viên" required>
            <input type="text" name="cccd" placeholder="Số CCCD" required>
            <input type="text" name="phone" placeholder="Số điện thoại" required>
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="confirm_password" placeholder="Nhập mật khẩu mới" required>
            <input type="password" name="confirm_password" placeholder="Xác nhận mật khẩu mới" required>
            <button type="submit">Xác nhận</button>
            <p class="login-link"><a href="./dangnhap.html">Quay lại đăng nhập</a></p>
        </form>
    </div>
</body>
</html>
