<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../style/style_home_sv.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <!-- Toggle Button -->
    <button id="toggle-button" class="toggle-button">☰</button>

    <!-- Sidebar -->
    <div class="dashboard" id="dashboard">
      <div class="dashboard-header">
        <h2>Dashboard</h2>
      </div>
      <ul class="dashboard-menu">
        <li><a href="./home.html" title="Home"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="./account_sv.html" title="Account sinh viên"><i class="fas fa-user-graduate"></i><span>Account sinh viên</span></a></li>
        <li><a href="./account_gv.html" title="Account giảng viên"><i class="fas fa-chalkboard-teacher"></i><span>Account giảng viên</span></a></li>
        <li><a href="./quanly_kv.html" title="Quản lý khoa viên"><i class="fas fa-school"></i><span>Quản lý khoa viên</span></a></li>
        <li><a href="./quanly_tkb.html" title="Quản lý thời khóa biểu"><i class="fas fa-calendar-day"></i><span>Quản lý thời khóa biểu</span></a></li>
        <li><a href="./quanly_dd.html" title="Quản lý điểm danh"><i class="fas fa-check-circle"></i><span>Quản lý điểm danh</span></a></li>
        <li><a href="https://www.hutech.edu.vn/" title="Settings"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li><a href="./dangnhap.html" title="Logout"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2>Thời khóa biểu</h2>
      <div class="week-control">
        <button id="prev-week">&lt;</button>
        <span id="week-range">Loading...</span>
        <button id="next-week">&gt;</button>
      </div>

      <div id="schedule-container">
        <!-- Thời khóa biểu sẽ được chèn ở đây -->
      </div>
    </div>

    <script>
      const toggleButton = document.getElementById('toggle-button');
      const dashboard = document.getElementById('dashboard');
      toggleButton.addEventListener('click', () => {
        dashboard.classList.toggle('collapsed');
      });

      const weekRange = document.getElementById("week-range");
      const prevBtn = document.getElementById("prev-week");
      const nextBtn = document.getElementById("next-week");
      const scheduleContainer = document.getElementById("schedule-container");

      let currentDate = new Date("2025-04-21");

      function formatDate(date) {
        const d = date.getDate().toString().padStart(2, '0');
        const m = (date.getMonth() + 1).toString().padStart(2, '0');
        const y = date.getFullYear();
        return `${d}/${m}/${y}`;
      }

      function formatAPIKey(date) {
        return formatDate(date).split('/').reverse().join('-');
      }

      async function fetchSchedule(weekKey) {
        try {
          const res = await fetch(`https://api.example.com/tkb?week=${weekKey}`);
          if (!res.ok) throw new Error("Không thể tải dữ liệu từ API");
          return await res.json(); // API trả về mảng thời khóa biểu
        } catch (err) {
          console.error(err);
          return null;
        }
      }

      async function renderSchedule() {
        scheduleContainer.innerHTML = "<p>Đang tải...</p>";
        const weekKey = formatAPIKey(currentDate);
        const schedule = await fetchSchedule(weekKey);

        scheduleContainer.innerHTML = ""; // Xóa loading

        if (schedule && schedule.length > 0) {
          schedule.forEach(item => {
            const div = document.createElement("div");
            div.className = "schedule-card";
            div.innerHTML = `
              <div class="day red">${item.day}</div>
              <div class="class-info">
                <div><strong>Tiết:</strong> ${item.tiet}</div>
                <div><strong>Môn:</strong> ${item.mon}</div>
                <div><strong>Phòng:</strong> ${item.phong}</div>
              </div>
            `;

            div.addEventListener("click", async () => {
              try {
                await fetch("https://api.example.com/log-click", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(item)
                });
              } catch (error) {
                console.warn("Ghi log không thành công, nhưng vẫn tiếp tục.");
              }

              const params = new URLSearchParams(item);
              window.location.href = `ct_tkb.html?${params.toString()}`;
            });

            scheduleContainer.appendChild(div);
          });
        } else {
          scheduleContainer.innerHTML = "<p>Không có lịch học cho tuần này.</p>";
        }
      }

      function updateWeekRange() {
        const startOfWeek = new Date(currentDate);
        const endOfWeek = new Date(currentDate);
        endOfWeek.setDate(endOfWeek.getDate() + 6);
        weekRange.textContent = `${formatDate(startOfWeek)} đến ${formatDate(endOfWeek)}`;
        renderSchedule();
      }

      prevBtn.addEventListener("click", () => {
        currentDate.setDate(currentDate.getDate() - 7);
        updateWeekRange();
      });

      nextBtn.addEventListener("click", () => {
        currentDate.setDate(currentDate.getDate() + 7);
        updateWeekRange();
      });

      updateWeekRange(); // Gọi khi trang tải lần đầu
    </script>
  </body>
</html>
